[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingo-nlp-toolkit"
version = "2.4.0"
description = "Unified NLP toolkit: one Pipeline API for sentiment, NER, classification, embeddings, QA and summarization on Hugging Face models, plus spaCy/NLTK text preprocessing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Md Irfan Ali", email = "irfanali29@hotmail.com"}
]
maintainers = [
    {name = "Md Irfan Ali", email = "irfanali29@hotmail.com"}
]
keywords = [
    "nlp",
    "natural-language-processing",
    "transformers",
    "huggingface",
    "bert",
    "text-processing",
    "text-preprocessing",
    "sentiment-analysis",
    "named-entity-recognition",
    "ner",
    "text-classification",
    "embeddings",
    "sentence-transformers",
    "question-answering",
    "summarization",
    "spacy",
    "nltk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2.0",
    "spacy>=3.5.0",
    "nltk>=3.8",
    "scikit-learn>=1.1.0",
    "numpy>=1.23",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# Serving a pipeline behind an HTTP API (see README "REST API Template")
api = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
]
# Dependencies used by the example scripts in examples/
examples = [
    "pandas>=1.5.0",
]
full = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pandas>=1.5.0",
    "pdfplumber>=0.7.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.0.10",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.10.0",
    "umap-learn>=0.5.3",
    "wordcloud>=1.9.0",
    "textstat>=0.7.3",
]
gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchaudio>=2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "pre-commit>=3.5",
    "build>=1.0.0",
    "twine>=5.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/lingo-nlp-toolkit"
Documentation = "https://github.com/irfanalidv/lingo-nlp-toolkit#readme"
Repository = "https://github.com/irfanalidv/lingo-nlp-toolkit"
Issues = "https://github.com/irfanalidv/lingo-nlp-toolkit/issues"
Changelog = "https://github.com/irfanalidv/lingo-nlp-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
lingo = "lingo.cli:main"

[tool.setuptools]
packages = ["lingo", "lingo.configs"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
lingo = ["py.typed"]
"lingo.configs" = ["*.yaml", "*.yml"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]
ignore = [
    "E501",  # long lines are handled by the formatter
    "B008",  # function calls in argument defaults (argparse/typer style)
]

[tool.ruff.lint.per-file-ignores]
# Example scripts print to stdout and favour readability
"examples/*" = ["E402"]
# Test fakes mimic HF objects with class-level dicts; unicode quotes are test data
"tests/*" = ["RUF012", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["lingo"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lingo"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
